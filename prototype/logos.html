<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neura Logo Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fragment+Mono&display=swap">
<style>
:root{--bg:#fff;--paper:#fff;--line:#e4e2ea;--fg:#16161d;--lbl:#4b4a57;--muted:#8b8996;--accent:#3a55e6;--ink:#16161d;
  --sans:'Inter',ui-sans-serif,system-ui,sans-serif;--code:'Fragment Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
main{max-width:1120px;margin:0 auto;padding:48px 16px 80px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:32px}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.03em}
.kicker{font-family:var(--code);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
header p{margin:6px 0 0;max-width:56ch;color:var(--lbl);line-height:1.6;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card.pick{border-color:var(--accent);box-shadow:0 0 0 3px #e9edff}
.stage{aspect-ratio:16/10;display:grid;place-items:center;background:#faf9fb;border-bottom:1px solid var(--line);position:relative}
.stage svg.big{width:112px;height:112px}
.badge{position:absolute;top:12px;left:12px;font-family:var(--code);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 8px;border-radius:999px}
.sizes{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;flex:none}
.tile.dark{background:#16161d;border-color:#16161d}
.tile.grad{background:linear-gradient(135deg,#ff7a59,#a98bff 50%,#3a55e6);border:0}
.tile svg{width:28px;height:28px}
.tiny{width:16px;height:16px}
.lockup{margin-left:auto;display:flex;align-items:center;gap:7px;font-weight:650;font-size:16px;letter-spacing:-.02em}
.lockup svg{width:22px;height:22px}
.info{padding:14px 16px 18px}
.info h2{margin:0 0 4px;font-size:15px;font-weight:650}
.info p{margin:0;font-size:13px;line-height:1.55;color:var(--lbl)}
.info .tags{margin-top:10px;font-family:var(--code);font-size:10.5px;color:var(--muted)}
footer{margin-top:28px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff7a59"/><stop offset=".5" stop-color="#a98bff"/><stop offset="1" stop-color="#3a55e6"/></linearGradient>
    <!-- 01 Neuron -->
    <symbol id="m1" viewBox="0 0 32 32">
      <g fill="none" style="stroke:var(--s, url(#g))" stroke-width="2.2" stroke-linecap="round"><path d="M16 16C13 13 10 11 6.5 9"/><path d="M16 16c2-3.5 4.5-6.5 8.5-8.5"/><path d="M16 16c3.5 1 7 3 9.5 6"/><path d="M16 16c-1.5 3.5-4 6.5-7.5 8.5"/></g>
      <g style="fill:var(--s, url(#g))"><circle cx="6.5" cy="9" r="2.4"/><circle cx="24.5" cy="7.5" r="2.4"/><circle cx="25.5" cy="22" r="2.4"/><circle cx="8.5" cy="24.5" r="2.4"/><circle cx="16" cy="16" r="5.2"/></g>
      <circle cx="16" cy="16" r="1.9" style="fill:var(--h, #fff)"/>
    </symbol>
    <!-- 02 n-network -->
    <symbol id="m2" viewBox="0 0 32 32">
      <path d="M8 25V12.5a5.5 5.5 0 0 1 11 0V25" fill="none" style="stroke:var(--s, url(#g))" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M19 12.5L25 7" fill="none" style="stroke:var(--s, url(#g))" stroke-width="2.4" stroke-linecap="round"/>
      <g style="fill:var(--s, url(#g))"><circle cx="8" cy="25" r="3"/><circle cx="19" cy="25" r="3"/><circle cx="25" cy="7" r="3"/></g>
      <circle cx="25" cy="7" r="1.1" style="fill:var(--h, #fff)"/>
    </symbol>
    <!-- 03 Synapse -->
    <symbol id="m3" viewBox="0 0 32 32">
      <circle cx="9.5" cy="16" r="6" style="fill:var(--s, url(#g))"/>
      <circle cx="23.5" cy="16" r="4.2" fill="none" style="stroke:var(--s, url(#g))" stroke-width="2.2"/>
      <g style="fill:var(--s, url(#g))"><circle cx="17.6" cy="12.6" r="1.3"/><circle cx="18.2" cy="16" r="1.3"/><circle cx="17.6" cy="19.4" r="1.3"/></g>
    </symbol>
    <!-- 04 Branch -->
    <symbol id="m4" viewBox="0 0 32 32">
      <path d="M6 22c5 0 7-1 10-5s5-9 11-9M16 17c2.5 3 5 5 11 5" fill="none" style="stroke:var(--s, url(#g))" stroke-width="2.4" stroke-linecap="round"/>
      <g style="fill:var(--s, url(#g))"><circle cx="6" cy="22" r="3.2"/><circle cx="27" cy="8" r="2.5"/><circle cx="27" cy="22" r="2.5"/></g>
      <circle cx="16" cy="17" r="2.3" style="fill:var(--h, #fff);stroke:var(--s, url(#g))" stroke-width="1.8"/>
    </symbol>
    <!-- 05 Cluster -->
    <symbol id="m5" viewBox="0 0 32 32">
      <g fill="none" style="stroke:var(--s, url(#g))" stroke-width="1.8" stroke-linecap="round" opacity=".9"><path d="M9 9l8 3.5M9 9l3 13M17 12.5L12 22M17 12.5l7.5 3M12 22l12.5-6.5M24.5 15.5L23 25"/></g>
      <g style="fill:var(--s, url(#g))"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="12.5" r="2.2"/><circle cx="12" cy="22" r="3.6"/><circle cx="24.5" cy="15.5" r="2.6"/><circle cx="23" cy="25" r="1.8"/></g>
    </symbol>
    <!-- 06 Spark -->
    <symbol id="m6" viewBox="0 0 32 32">
      <path d="M16 4c1 6.5 5.5 11 12 12-6.5 1-11 5.5-12 12-1-6.5-5.5-11-12-12 6.5-1 11-5.5 12-12z" style="fill:var(--s, url(#g))"/>
      <g style="fill:var(--h, #fff)"><circle cx="16" cy="16" r="1.6"/></g>
      <g fill="none" style="stroke:var(--h, #fff)" stroke-width="1.2" stroke-linecap="round" opacity=".9"><path d="M16 16l3.5-3.5M16 16l-3.5 3.5"/></g>
    </symbol>
  </defs>
</svg>

<main>
  <header>
    <div>
      <div class="kicker">Neura · identity</div>
      <h1>Logo explorations</h1>
      <p>Six simple marks built on one idea: a thought that connects and branches. Each is shown large, as an app tile, in one colour on dark, at 16px, and as a lockup with the wordmark. The prototype currently uses <b>02 n-network</b>.</p>
    </div>
  </header>

  <div class="grid" id="grid"></div>
  <footer><a href="./">← back to the prototype</a></footer>
</main>

<script>
const marks = [
  ['m1','Neuron','A soma with four dendrites. Literal enough to read as “neural”, loose enough to feel hand-drawn. Holds up well small.','literal · holds up small'],
  ['m2','n-network','The lowercase n of “neura” drawn as a path between nodes, with one tangent breaking away. Doubles as a monogram.','in prototype · monogram',true],
  ['m3','Synapse','Two cells and the gap between them, with signals crossing. About the moment one idea sparks another.','quiet · good as a favicon'],
  ['m4','Branch','One conversation, then a tangent. Mirrors how the map actually grows from the timeline spine.','tells the product story'],
  ['m5','Cluster','A small network of uneven nodes. Feels like the mind-map view at a glance.','most “map-like” · busier at 16px'],
  ['m6','Spark','A four-point spark with a neural cross at its heart. The friendliest of the set, and closest to “ideas” in general.','playful · least literal'],
];
const use = (id, cls = '', style = '') => `<svg class="${cls}" style="${style}" viewBox="0 0 32 32" aria-hidden="true"><use href="#${id}"/></svg>`;
document.getElementById('grid').innerHTML = marks.map(([id, name, note, tags, pick], i) => `
  <article class="card ${pick ? 'pick' : ''}">
    <div class="stage">${pick ? '<span class="badge">in use</span>' : ''}${use(id, 'big')}</div>
    <div class="sizes">
      <span class="tile">${use(id)}</span>
      <span class="tile dark">${use(id, '', '--s:#fff;--h:#16161d')}</span>
      <span class="tile grad">${use(id, '', '--s:#fff;--h:#6d6ef0')}</span>
      ${use(id, 'tiny')}
      <span class="lockup">${use(id)}neura</span>
    </div>
    <div class="info"><h2>0${i + 1} · ${name}</h2><p>${note}</p><div class="tags">${tags}</div></div>
  </article>`).join('');
</script>
</body>
</html>
