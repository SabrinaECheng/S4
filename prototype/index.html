<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fragment+Mono:ital@0;1&display=swap">
<style>
/* Layout (Figma-style): logo top-left, replay top-centre, tool dock bottom-centre, zoom bottom-right,
   detail drawer right. View options live in a popover from the dock, not on the canvas.
   Look: white canvas with a soft corner wash, coral / lavender / cobalt accents, Inter for UI, Fragment Mono for small meta. */
:root{
  --bg:#fff; --paper:#fff; --surface:rgba(255,255,255,.88); --surface-2:#f0eff4; --line:#e4e2ea; --line-2:#cfccd8;
  --fg:#16161d; --lbl:#4b4a57; --muted:#8b8996; --accent:#3a55e6; --accent-soft:#e9edff; --warn:#e5484d;
  --coral:#ff7a59; --violet:#a98bff;
  --sans:'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --code:'Fragment Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --shadow:0 1px 2px rgba(22,20,40,.06), 0 8px 28px rgba(22,20,40,.08);
  --shadow-lg:0 2px 4px rgba(22,20,40,.06), 0 24px 60px rgba(22,20,40,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:12.5px;overflow:hidden;-webkit-font-smoothing:antialiased;margin:0}
button,input,select{font:inherit;color:inherit}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;
  background-color:var(--bg)}
#map:active{cursor:grabbing}
.glass{background:var(--surface);border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);box-shadow:var(--shadow)}

/* canvas: white with a soft coral / lavender / cobalt wash in the corners */
#map,.board{background-image:radial-gradient(42% 48% at 0% 0%, rgba(255,122,89,.09), transparent 70%), radial-gradient(42% 52% at 100% 0%, rgba(169,139,255,.11), transparent 70%), radial-gradient(48% 52% at 85% 100%, rgba(58,85,230,.07), transparent 70%);background-size:100% 100%}

/* ---- map marks ---- */
.edge{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cross{fill:none;stroke:#8b8996;stroke-dasharray:4 5;stroke-opacity:.5;vector-effect:non-scaling-stroke}
.spine{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.55}
.convpath{fill:none;stroke:var(--fg);stroke-opacity:.22;stroke-width:1.2;stroke-dasharray:1 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
body.playing .convpath{animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-12}}
.neb{mix-blend-mode:multiply;pointer-events:none}
.node{cursor:pointer}
.node .body{vector-effect:non-scaling-stroke}
.node .core{pointer-events:none}
.node .pickring{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;display:none;pointer-events:none}
.node.picked .pickring{display:inline}
.node.sel .body{stroke:var(--fg);stroke-width:2}
.node:focus{outline:none}
.node:focus-visible .body{stroke:var(--accent);stroke-width:3}
.node.fade{opacity:.22}
.node.born .body{animation:born .9s ease-out}
@keyframes born{0%{r:0}60%{r:18}100%{}}
.ring{fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none;animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{r:6;opacity:.9}100%{r:30;opacity:0}}
.lbl{fill:var(--lbl);font-family:var(--sans);font-weight:500;letter-spacing:-.02em;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.lbl.t0,.lbl.t1{fill:var(--fg);font-weight:650;letter-spacing:-.02em;stroke:none}
.pill{fill:var(--paper);fill-opacity:.94;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(22,20,40,.08))}
body[data-zoom="near"] .pill{display:none}
body[data-zoom="far"] .lbl.t2,body[data-zoom="far"] .lbl.t3{display:none}
body[data-zoom="mid"] .lbl.t3{opacity:.75}
body[data-zoom="near"] .lbl,body[data-zoom="near"] .node .body,body[data-zoom="near"] .node .core,body[data-zoom="near"] .node .pickring{display:none}
.node.lit .lbl{fill:var(--fg);opacity:1!important}
.tick{fill:var(--muted);font-family:var(--code);letter-spacing:.08em;pointer-events:none}

.cardfo{display:none;overflow:visible}
body[data-zoom="near"] .cardfo{display:inline}
.card{width:168px;padding:8px 9px 9px;border-radius:6px;background:var(--paper);border:1px solid color-mix(in srgb, var(--c) 30%, var(--line));
  box-shadow:0 1px 2px rgba(22,20,40,.06), 0 4px 12px rgba(22,20,40,.06);font-family:var(--sans);color:var(--fg);display:flex;flex-direction:column;gap:4px}
.node.sel .card{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb, var(--c) 30%, transparent), 0 6px 18px rgba(22,20,40,.1)}
.node.picked .card{outline:1.5px dashed var(--accent);outline-offset:3px}
.c-head{display:flex;align-items:center;gap:5px;font-family:var(--code);font-size:5.4px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb, var(--c) 65%, var(--fg))}
.c-head span:last-child{margin-left:auto;color:var(--muted)}
.c-title{font-size:8.4px;font-weight:650;line-height:1.3;letter-spacing:-.01em}
.c-body{font-size:6.2px;line-height:1.55;color:var(--lbl);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.c-quote{font-size:6px;line-height:1.5;color:var(--lbl);font-style:italic;border-left:1px solid var(--c);padding-left:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---- map chrome ---- */
.logo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px, env(safe-area-inset-left,0px));z-index:5;width:44px;height:44px;display:grid;place-items:center;padding:0}
.logo svg{width:28px;height:28px;display:block}

.replay{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);z-index:5;
  width:min(440px, calc(100vw - 32px - 120px));height:44px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:0 14px 0 6px}
.play{width:32px;height:32px;border-radius:9px;border:0;background:var(--fg);cursor:pointer;display:grid;place-items:center;color:#fff}
.play:hover{background:#2c2c38}
.play:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#scrub{width:100%;accent-color:var(--accent);margin:0}
.count{font-family:var(--code);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:8px}
.live{color:var(--warn);display:inline-flex;align-items:center;gap:5px}
.live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--warn);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.ticker{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);max-width:min(560px, calc(100vw - 32px));padding:6px 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:11.5px;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker:empty{display:none}
.ticker b{color:var(--accent);font-weight:500;font-family:var(--code);font-size:10.5px}

/* bottom dock, like Figma's toolbar */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:6;
  display:flex;align-items:center;gap:2px;padding:6px;border-radius:14px;max-width:calc(100vw - 32px)}
.dock .sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.ibtn{position:relative;flex:none;width:36px;height:36px;border-radius:9px;border:0;background:none;color:var(--lbl);cursor:pointer;display:grid;place-items:center}
.ibtn svg{width:19px;height:19px}
.ibtn:hover{background:var(--surface-2);color:var(--fg)}
.ibtn[aria-pressed="true"],.ibtn[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.ibtn:focus-visible,.tbtn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ibtn .badge{position:absolute;top:3px;right:2px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-family:var(--code);font-size:9px;line-height:15px;text-align:center}
.ibtn .badge:empty{display:none}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);padding:5px 8px;border-radius:6px;background:var(--fg);color:#fff;
  font-family:var(--sans);font-size:11px;font-weight:500;white-space:nowrap;pointer-events:none;z-index:10}
.seg{display:flex;padding:3px;gap:2px;background:var(--surface-2);border-radius:10px;flex:none}
.seg button{background:none;border:0;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--fg);box-shadow:0 1px 2px rgba(22,20,40,.1)}
.tbtn{background:none;border:0;border-radius:9px;height:36px;padding:0 10px;font-size:12px;font-weight:500;color:var(--lbl);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.tbtn svg{width:17px;height:17px}
.tbtn:hover{background:var(--surface-2);color:var(--fg)}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tbtn.hot{background:var(--accent);color:#fff;margin-left:4px}
.tbtn.hot:hover{filter:brightness(1.08)}
.tbtn:disabled{opacity:.5;cursor:default}

.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:6;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;white-space:nowrap}
.tray .dots{display:flex}
.tray .dots .dot{margin-left:-3px;border:1.5px solid var(--paper)}
.go{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer}
.go:hover{filter:brightness(1.08)}
.go:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.go:disabled{opacity:.4;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12px;color:var(--lbl);cursor:pointer}
.ghost:hover{color:var(--fg);background:var(--surface-2)}
.ghost:focus-visible{outline:2px solid var(--accent)}

.zoombox{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5;display:flex;align-items:center;gap:2px;padding:6px}
.zoombox button,.ws-zoom button{background:none;border:0;width:32px;height:36px;border-radius:9px;cursor:pointer;display:grid;place-items:center;font-size:16px;color:var(--lbl)}
.zoombox button:hover,.ws-zoom button:hover{background:var(--surface-2);color:var(--fg)}
.zoombox button:focus-visible,.ws-zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.zpct{font-family:var(--code);font-size:11px;color:var(--lbl);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
body.panel-open .zoombox{right:calc(358px + max(16px, env(safe-area-inset-right,0px)))}
body.panel-open .dock,body.panel-open .tray,body.panel-open .replay,body.panel-open .viewpop{transform:translateX(calc(-50% - 175px))}

/* view settings popover */
.viewpop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:8;width:min(320px, calc(100vw - 32px));
  padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;background:var(--paper);box-shadow:var(--shadow-lg)}
.viewpop header{display:flex;align-items:baseline;justify-content:space-between}
.viewpop h2{margin:0;font-size:13px;font-weight:650}
.vp-lvl{font-family:var(--code);font-size:10.5px;color:var(--muted)}
.vp-lvl b{color:var(--fg);font-weight:400}
.vp-sec{display:flex;flex-direction:column;gap:7px}
.vp-sec h3,.panel h3,.shelf h3{margin:0;font-family:var(--code);font-size:10px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px, env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:330px;z-index:7;
  overflow-y:auto;padding:14px 18px 20px;display:flex;flex-direction:column;gap:16px;background:var(--paper);border-radius:14px;box-shadow:var(--shadow-lg)}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 8px;min-width:0;color:var(--lbl)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.close{background:none;border:0;width:30px;height:30px;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.close:hover{background:var(--surface-2);color:var(--fg)}
.close:focus-visible{outline:2px solid var(--accent)}
.panel h2{margin:0;font-size:19px;font-weight:650;line-height:1.3;letter-spacing:-.015em;text-wrap:balance}
.meta{margin:-10px 0 0;font-family:var(--code);font-size:10.5px;color:var(--muted)}
.panel section{display:flex;flex-direction:column;gap:8px}
.body-text{margin:0;font-size:13px;line-height:1.6;color:var(--lbl)}
blockquote{margin:0;padding:10px 12px;background:var(--surface-2);border-left:2px solid var(--accent);border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.55;color:var(--fg);font-style:italic}
.rows{display:flex;flex-direction:column;gap:1px}
.row{background:none;border:0;border-radius:8px;padding:7px 8px;text-align:left;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:9px}
.row:hover{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--accent)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12px;cursor:pointer;text-align:left;min-width:0}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent)}
.btn small{display:block;color:var(--muted);font-size:10.5px;margin-bottom:2px}
.btn span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{font-family:var(--code);font-size:10px;color:var(--muted);margin-top:auto}

/* ---- drop + import ---- */
.dropzone{position:fixed;inset:12px;z-index:30;border:1.5px dashed var(--accent);border-radius:16px;background:rgba(255,255,255,.88);display:grid;place-items:center;text-align:center;pointer-events:none}
.dropzone b{display:block;font-size:17px;font-weight:650;margin-bottom:6px}
.dropzone span{color:var(--muted);font-family:var(--code);font-size:11px}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:min(460px, calc(100vw - 32px));max-height:calc(100vh - 48px);overflow-y:auto;
  padding:20px 20px 16px;display:flex;flex-direction:column;gap:14px;background:var(--paper);border-radius:16px;box-shadow:var(--shadow-lg)}
.sheet h2{margin:0;font-size:16px;font-weight:650}
.sheet p{margin:0;font-size:12.5px;line-height:1.6;color:var(--lbl)}
.files{display:flex;flex-direction:column;gap:4px}
.file-row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:8px;font-size:12px}
.file-row span:last-child{color:var(--muted);white-space:nowrap}
.file-row.bad span:last-child{color:var(--warn)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:12.5px;line-height:1.5}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{accent-color:var(--accent);margin:3px 0 0}
.opt small{display:block;color:var(--muted);font-size:11px}
.sheet .actions{justify-content:flex-end}
.progress{font-size:12px;color:var(--accent);display:flex;gap:8px;align-items:center}
.spin{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--warn)!important}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:11px;align-self:flex-start}
.linkish:hover{color:var(--fg)}
.backdrop{position:fixed;inset:0;z-index:29;background:rgba(22,22,29,.22)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:40;padding:9px 14px;font-size:12px;background:var(--fg);color:#fff;border-radius:10px;box-shadow:var(--shadow-lg)}

/* ---- workspace ---- */
.ws{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.ws-bar{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));
  display:flex;align-items:flex-start;gap:8px;pointer-events:none}
.ws-bar > *{pointer-events:auto}
.ws-head{display:flex;align-items:center;gap:6px;padding:5px 14px 5px 5px;min-width:0;max-width:min(720px, calc(100vw - 32px))}
.ws-back{flex:none;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;cursor:pointer;color:var(--lbl);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.ws-back:hover{background:var(--surface-2);color:var(--fg)}
.ws-back:focus-visible{outline:2px solid var(--accent)}
.ws-head .sep{width:1px;height:22px;background:var(--line);flex:none;margin-right:6px}
.ws-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.ws-title b{font-size:13px;font-weight:650}
.ws-title span{font-size:10.5px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ws-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border-radius:999px;padding:1px 8px;color:var(--lbl)}
.board{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--bg)}
.board:active{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.wlinks{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wlinks path{fill:none;stroke:rgba(58,85,230,.4);stroke-width:1.3;stroke-dasharray:4 5}
.item{position:absolute;border-radius:6px;cursor:grab;user-select:none}
.item.sel{outline:2px solid var(--accent);outline-offset:3px}
.item.dragging{cursor:grabbing;z-index:5}
.ncard{width:270px;padding:14px 15px 15px;background:var(--paper);border:1px solid color-mix(in srgb, var(--c) 35%, var(--line));border-top:3px solid var(--c);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.i-head{display:flex;align-items:center;gap:6px;font-family:var(--code);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb, var(--c, var(--muted)) 65%, var(--fg))}
.i-head i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.i-head span:last-child{margin-left:auto;color:var(--muted);text-transform:none;letter-spacing:0}
.item h4{margin:0;font-size:14px;font-weight:650;line-height:1.35;letter-spacing:-.01em}
.item p{margin:0;font-size:12px;line-height:1.6;color:var(--lbl)}
.item blockquote{font-size:11.5px;padding:7px 10px}
.sticky{width:180px;min-height:130px;padding:12px 12px 14px;background:color-mix(in srgb, var(--c) 24%, #fff);border-radius:3px;

const PALETTE = ['#4c6ef5','#ff6b4a','#9b6bff','#14b8a6','#f0a020','#e8559c','#3fae5a'];
const ROOTC = '#3a55e6', ACC = '#3a55e6', REFC = '#a3a1b0';

// ---------- model ----------
let MAP, nodes, byId, tree, cross, adj, THEMES, N, parentOf;
function buildModel(map){
  MAP = map;
  const data = map.data;
  parentOf = {};
  Object.entries(data).forEach(([id, n]) => n.children.forEach(c => parentOf[c] = id));
  THEMES = data.root.children.slice();
  const color = {root: ROOTC}; THEMES.forEach((t, i) => color[t] = PALETTE[i % PALETTE.length]);
  const order = [], depth = {}, theme = {};
  (function walk(id, d, th){ order.push(id); depth[id] = d; theme[id] = th; data[id].children.forEach(c => walk(c, d + 1, d === 0 ? c : th)); })('root', 0, 'root');
  N = order.length;
  nodes = order.map((id, i) => {
    const s = data[id], d = depth[id];
    const type = s.ai ? 'suggestion' : d <= 1 ? 'hub' : kindType(String(s.kind || ''));
    return {id, i, d, type, ai: !!s.ai, theme: theme[id], color: color[theme[id]], label: s.label, kind: s.ai ? 'AI suggestion' : s.kind, detail: s.detail, quote: s.quote, children: s.children};
  });
  const sub = id => data[id].children.reduce((a, c) => a + 1 + sub(c), 0);
  nodes.forEach(n => {
    n.desc = sub(n.id);
    n.w = 1 + n.desc * 1.4 + (n.quote ? 1 : 0) + String(n.detail || '').length / 110;
    n.r = n.type === 'suggestion' ? 5 : R[Math.min(n.d, 3)] * Math.min(1.6, .78 + Math.sqrt(n.w) * .16);
  });
  byId = new Map(nodes.map(n => [n.id, n]));
  tree = nodes.filter(n => n.d > 0).map(n => ({source: byId.get(parentOf[n.id]), target: n}));
  cross = (map.cross || []).filter(([a, b]) => byId.has(a) && byId.has(b) && a !== b).map(([a, b]) => ({source: byId.get(a), target: byId.get(b)}));
  adj = new Map(nodes.map(n => [n.id, new Set()]));
  tree.concat(cross).forEach(l => { adj.get(l.source.id).add(l.target.id); adj.get(l.target.id).add(l.source.id); });
}

function kindType(k){

  if (/reference|competitor|tool/i.test(k)) return 'ref';

    ref: `fill="${REFC}"`, suggestion: `fill="none" stroke="${ACC}" stroke-width="1.2" stroke-dasharray="2 2"`}[t];

const SLOT_W = 230, LEVEL_H = 250, THEME_GAP = 100;

    const total = THEMES.reduce((a, id) => a + span(byId.get(id)), 0);
    let a0 = -Math.PI / 2 - Math.PI * span(byId.get(THEMES[0])) / total;
    THEMES.forEach(tid => {

// Hub labels sit in a white pill, pushed off the spine to the side away from
// their children (alternating above/below in timeline), so text never rides the line.
function labelSide(n){
  if (mode !== 'timeline') return 1;

  return -(n.dir || 1);
}
function layoutLabels(){
  if (!nodeSel) return;
  const s = 1 / Math.min(Math.max(K, .1), 1.2), padX = 7 * s, padY = 3.5 * s, gap = 8 * s;
  nodeSel.filter(n => n.d <= 1).each(function(n){
    const g = d3.select(this), t = g.select('text.lbl'), side = labelSide(n);
    const fs = +t.attr('font-size') || 10;
    const h = fs * 1.25 + padY * 2, near = n.r + gap;
    const cy = side * (near + h / 2);                    // pill centre
    t.attr('dy', null).attr('y', cy).attr('dominant-baseline', 'central');
    let w = 0; try { w = t.node().getComputedTextLength(); } catch (e) {}
    g.select('rect.pill').attr('x', -w / 2 - padX).attr('y', cy - h / 2).attr('width', w + padX * 2).attr('height', h).attr('rx', h / 2);
    n.tickY = side * (near + h + 6 * s) + (side > 0 ? 8 * s : 0);

function viewport(){ const open = document.body.classList.contains('panel-open'), narrow = innerWidth <= 760; return {W: innerWidth - (open && !narrow ? 362 : 0), H: innerHeight - (open && narrow ? innerHeight * .6 : 0)}; }

  list.forEach(n => { const x = n.tx ?? n.x, y = n.ty ?? n.y; x0 = Math.min(x0, x - 180); y0 = Math.min(y0, y - 40); x1 = Math.max(x1, x + 180); y1 = Math.max(y1, y + 50); });
  const {W, H} = viewport(), top = 80, bottom = 120, side = 90;
  const k = Math.max(.06, Math.min(maxK, (W - side * 2) / (x1 - x0), (H - top - bottom) / (y1 - y0)));

function setStep(s, born){

      const n = nodes[i], p = byId.get(parentOf[n.id]);

    }

  const n = nodes[step];

// ---------- rebuild in place (after AI suggestions are added, kept or dismissed) ----------
function rebuild(){
  const pos = new Map(nodes.map(n => [n.id, {x: n.x, y: n.y, fx: n.fx, fy: n.fy}]));
  const keep = selected?.id;
  buildModel(MAP); setTargets();
  nodes.forEach(n => {
    const p = pos.get(n.id), pp = pos.get(parentOf[n.id]);
    if (p){ n.x = p.x; n.y = p.y; n.fx = p.fx; n.fy = p.fy; }
    else if (pp){ n.x = pp.x + (Math.random() - .5) * 16; n.y = pp.y + (Math.random() - .5) * 16; }
    else { n.x = n.tx; n.y = n.ty; }
  });

  selected = keep && byId.get(keep) || null;

async function suggestFor(n, btn){

    const kids = n.children.map(c => byId.get(c).label).join('; ') || 'none yet';
    try {
      const arr = await sample.json(`A team is mapping a brainstorm conversation. Suggest 3 follow-ups they have NOT discussed yet that would push this node forward.
Node: ${n.label} (${n.kind}): ${n.detail}
${par ? `It branched from: ${par.label}` : ''}
Already under it: ${kids}
Reply with ONLY a JSON array of 3 objects: {"label": string (at most 7 words), "kind": "Idea" or "Question", "detail": one plain sentence on why it matters}.`, {modelTier: 'quick', cache: false});
      list = (Array.isArray(arr) ? arr : []).filter(x => x && x.label).slice(0, 3)
        .map(x => ({label: String(x.label).slice(0, 70), kind: /question/i.test(x.kind) ? 'Question' : 'Idea', detail: String(x.detail || '').slice(0, 240)}));
    } catch (e) {

    }

  }
  if (!list.length){ btn.disabled = false; btn.textContent = '✦ suggest follow-ups'; return toast('No suggestions this time. Try again.'); }
  list.forEach((s, i) => { const id = 'ai_' + Date.now().toString(36) + i; MAP.data[id] = {label: s.label, kind: s.kind, detail: s.detail, quote: '', children: [], ai: true}; MAP.data[n.id].children.push(id); });

  rebuild(); toast(`${list.length} suggestions added around “${n.label}”`);
}

async function runImport(how){
  const files = pendingFiles.filter(f => TEXT_EXT.test(f.name));
  const texts = await Promise.all(files.map(async f => ({name: f.name, text: await f.text()})));
  // a saved neura map loads directly
  for (const t of texts){ if (/\.json$/i.test(t.name)){ try { const j = JSON.parse(t.text); const m = toMap(j, t.name); if (texts.length === 1){ commitMap(m); return; } } catch (e) {} } }
  if (!sample){ renderSheet('Claude isn’t available in this view, so only saved neura .json maps can load here.'); return; }
  let body = texts.map(t => `=== ${t.name} ===\n${t.text}`).join('\n\n');
  if (body.length > 140000) body = body.slice(0, 140000) + '\n[transcript cut for length]';
  const current = how === 'merge' ? JSON.stringify(compactMap(MAP)) : '';
  const prompt = `You turn brainstorm conversations into an idea map for an app called Neura.
Reply with ONLY this JSON shape:
{"title": string, "nodes": [{"id": string, "parent": string|null, "label": string, "kind": string, "detail": string, "quote": string}], "cross": [[string, string]]}
Rules:
- Exactly one node has parent null: the whole conversation, kind "Conversation".
- Its children are 3 to 7 themes, listed in the order they first came up in the conversation.
- Below each theme, ideas, questions, examples, references, tasks and tangents, at most 3 levels below the root.
- 25 to 60 nodes in total. List nodes in the order they were said; a parent always comes before its children.
- id: short unique snake_case. label: at most 6 words. kind: one of Theme, Main concept, Idea, Question, Example, Reference, Task, Outcome, Tangent, Supporting detail.
- detail: one or two plain sentences on what was said. quote: a short exact excerpt from the transcript (under 15 words), or "".
- cross: up to 8 pairs of node ids from different themes that the speakers connected.
- title: a short lowercase name for the session.
${how === 'merge' ? `Merge the new material into this existing map. Keep its useful structure and wording, add the new ideas where they belong, and keep everything in conversation order:\n${current}\n` : ''}
Transcripts and notes:
${body}`;
  runCtl = new AbortController();
  renderSheet(`reading ${texts.length} file${texts.length === 1 ? '' : 's'}… this usually takes under a minute`, true);
  try {
    let chars = 0;
    const j = await sample.json(prompt, {signal: runCtl.signal, onText: ({text}) => { chars = text.length; const p = $('sheet').querySelector('.progress span:last-child'); if (p) p.textContent = `structuring the map… ${chars.toLocaleString()} characters written`; }});
    runCtl = null;
    commitMap(toMap(j, files.map(f => f.name).join(', ')));
  } catch (e) {
    runCtl = null;
    const copy = {cancelled: 'Stopped.', not_granted: 'Claude access was declined for this page.', rate_limited: 'Too many requests right now. Try again in a minute.',
      prompt_too_large: 'Those files are too long. Try fewer or shorter files.', invalid_json: 'Claude’s answer wasn’t a usable map. Try again.', refused: 'Claude declined to structure these files.',
      session_expired: 'Sign in to claude.ai again, then retry.'}[e?.code] || (e?.message && !e.code ? e.message : 'Something went wrong. Try again.');
    if (e?.code === 'cancelled') return;
    renderSheet(copy);
  }
}
function compactMap(m){
  const out = []; (function w(id, p){ const n = m.data[id]; out.push({id, parent: p, label: n.label, kind: n.kind, detail: n.detail, quote: n.quote}); n.children.forEach(c => w(c, id)); })('root', null);
  return {title: m.title, nodes: out, cross: m.cross || []};
}
function toMap(j, source){
  if (j && j.data && j.data.root) return {id: 'm' + Date.now(), title: String(j.title || 'imported map'), data: j.data, cross: j.cross || []};
  if (!j || !Array.isArray(j.nodes) || !j.nodes.length) throw new Error('That file doesn’t contain a neura map.');
  const list = j.nodes.filter(n => n && n.id != null && n.label).slice(0, 90);
  const seen = new Set();
  list.forEach((n, i) => { let id = String(n.id).replace(/[^\w-]/g, '_').slice(0, 40) || 'n' + i; while (seen.has(id)) id += '_'; seen.add(id); n._id = id; n._p = n.parent == null ? null : String(n.parent).replace(/[^\w-]/g, '_').slice(0, 40); });
  const rootSrc = list.find(n => n._p == null) || list[0];
  const ren = id => id === rootSrc._id ? 'root' : (id === 'root' ? 'root_' : id);
  const data = {};
  list.forEach(n => data[ren(n._id)] = {label: String(n.label).slice(0, 70), kind: String(n.kind || 'Idea').slice(0, 30), detail: String(n.detail || '').slice(0, 500), quote: String(n.quote || '').slice(0, 200), children: []});
  list.forEach(n => { if (n === rootSrc) return; const me = ren(n._id); let p = n._p == null ? 'root' : ren(n._p); if (!data[p] || p === me) p = 'root'; data[p].children.push(me); });
  const reach = new Set();
  const w = id => { reach.add(id); const keep = []; for (const c of data[id].children){ if (!reach.has(c)){ keep.push(c); w(c); } } data[id].children = keep; };
  w('root');
  Object.keys(data).forEach(id => { if (!reach.has(id)){ data.root.children.push(id); w(id); } });
  if (!data.root.children.length) throw new Error('Claude’s map had no themes. Try again.');
  const crossOut = (Array.isArray(j.cross) ? j.cross : []).map(p => Array.isArray(p) ? p.map(x => ren(String(x).replace(/[^\w-]/g, '_').slice(0, 40))) : null).filter(p => p && data[p[0]] && data[p[1]]).slice(0, 12);
  return {id: 'm' + Date.now(), title: String(j.title || 'new session').slice(0, 60), data, cross: crossOut, source};
}
function commitMap(m){
  store.set('neura-map', m); closeImport(); loadMap(m); toast(`map rebuilt · ${N} thoughts across ${THEMES.length} themes`);
}

    }

}
function indexWs(){
  wsAll = allWorkspaces(); wsIdx = new Map();

async function wsDropFiles(files, cx, cy){
  const p = toWorld(cx, cy); let off = 0;
  for (const f of files){
    const size = f.size < 1024 ? f.size + ' B' : f.size < 1048576 ? (f.size / 1024).toFixed(1) + ' KB' : (f.size / 1048576).toFixed(1) + ' MB';
    const it = {id: 'f' + Date.now().toString(36) + off, type: 'file', name: f.name, size, x: Math.round(p.x - 125 + off), y: Math.round(p.y - 60 + off)};
    if (/^image\//.test(f.type)){
      if (f.size <= 900 * 1024) it.img = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(''); r.readAsDataURL(f); });
      else { it.img = URL.createObjectURL(f); it.temp = true; }
    } else if (/^text\//.test(f.type) || TEXT_EXT.test(f.name)){
      it.preview = (await f.text()).slice(0, 1200);
    } else it.note = 'Stored as a reference. Preview works for text and images.';
    ws.items.push(it); off += 24;
  }
  renderItems(); saveWs();
}
let saveT = null;
function saveWsSoon(){ clearTimeout(saveT); saveT = setTimeout(saveWs, 500); }
function saveWs(quiet){
  if (!ws.key) return;
  const ok = store.set(ws.key, {name: ws.name, updated: Date.now(), mapTitle: MAP.title, labels: ws.ids.map(id => byId.get(id)?.label || ''),
    items: ws.items.map(i => i.temp ? Object.assign({}, i, {img: '', note: 'Large image: drop it again after reloading.'}) : i)});
  if (!quiet || !ok){ $('wsStatus').textContent = ok ? 'saved' : 'couldn’t save (browser storage is off or full)'; clearTimeout(saveWs.t); if (ok) saveWs.t = setTimeout(() => { if ($('wsStatus').textContent === 'saved') $('wsStatus').textContent = ''; }, 1600); }
}
function fitBoard(dur = 400){
  const els = [...world.querySelectorAll('.item')]; if (!els.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  els.forEach(el => { const it = ws.items.find(i => i.id === el.dataset.id); x0 = Math.min(x0, it.x); y0 = Math.min(y0, it.y); x1 = Math.max(x1, it.x + el.offsetWidth); y1 = Math.max(y1, it.y + el.offsetHeight); });
  const r = board.getBoundingClientRect(), pad = 60;
  const k = Math.max(.2, Math.min(1.1, (r.width - pad * 2) / (x1 - x0), (r.height - pad * 2) / (y1 - y0)));
  const t = d3.zoomIdentity.translate(r.width / 2 - k * (x0 + x1) / 2, r.height / 2 - k * (y0 + y1) / 2).scale(k);
  (dur && !RM ? d3.select(board).transition().duration(dur) : d3.select(board)).call(bZoom.transform, t);
}
$('wzin').onclick = () => d3.select(board).transition().duration(RM ? 0 : 200).call(bZoom.scaleBy, 1.3);
$('wzout').onclick = () => d3.select(board).transition().duration(RM ? 0 : 200).call(bZoom.scaleBy, 1 / 1.3);
$('wzfit').onclick = () => fitBoard();

// AI next steps inside a workspace
$('wsAI').onclick = async () => {
  if (!sample) return;
  const btn = $('wsAI'); btn.disabled = true;
  $('wsStatus').innerHTML = '<span class="spin" aria-hidden="true"></span> thinking about next steps…';
  const ctx = ws.ids.map(id => { const n = byId.get(id); return `- ${n.label} (${n.kind}): ${n.detail}${n.quote ? ` Quote: "${n.quote}"` : ''}\n  inside: ${n.children.map(c => byId.get(c).label).join('; ') || 'nothing'}`; }).join('\n');
  const notes = ws.items.filter(i => i.type === 'sticky' && i.id.startsWith('u') && i.text.trim()).map(i => '- ' + i.text.trim().slice(0, 200)).join('\n');
  try {
    const arr = await sample.json(`A team brainstormed and is now working on these ideas from their conversation map:\n${ctx}\n${notes ? `Their notes on the whiteboard so far:\n${notes}\n` : ''}\nPropose 5 concrete next steps the team could do this week to move these ideas forward. Reply with ONLY a JSON array of strings, each under 16 words, starting with a verb.`, {cache: false});
    const list = (Array.isArray(arr) ? arr : []).map(String).filter(Boolean).slice(0, 6);
    if (!list.length) throw {code: 'empty_completion'};
    let x1 = -Infinity, y0 = Infinity;
    world.querySelectorAll('.item').forEach(el => { const it = ws.items.find(i => i.id === el.dataset.id); x1 = Math.max(x1, it.x + el.offsetWidth); y0 = Math.min(y0, it.y); });
    list.forEach((t, i) => ws.items.push({id: 'ai' + Date.now().toString(36) + i, type: 'sticky', ai: true, tag: 'AI · next step', text: t, x: Math.round(x1 + 80 + (i % 2) * 195), y: Math.round(y0 + Math.floor(i / 2) * 140)}));
    renderItems(); saveWs(); fitBoard();
    $('wsStatus').textContent = `${list.length} next steps added · edit or delete any of them`;
  } catch (e) {
    $('wsStatus').textContent = e?.code === 'not_granted' ? 'Claude access was declined for this page.' : e?.code === 'rate_limited' ? 'Too many requests. Try again in a minute.' : 'Couldn’t generate next steps. Try again.';
  } finally { btn.disabled = false; }
};

if (savedMap){ try { const m = savedMap.data?.root ? savedMap : null; if (m) initial = m; } catch (e) {} }
loadMap(initial, {fresh: true});
